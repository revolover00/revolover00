<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Baldwin — Full-Stack Developer">
  <title>Baldwin — Full-Stack Developer</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070C"/><stop offset="0.55" stop-color="#04060A"/><stop offset="1" stop-color="#060812"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22E6FF" stop-opacity="0.30"/><stop offset="1" stop-color="#22E6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.35" stop-color="#04060A" stop-opacity="0"/><stop offset="1" stop-color="#04060A" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22E6FF"/><stop offset="0.5" stop-color="#9BE8FF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22E6FF" stop-opacity="0"/><stop offset="0.5" stop-color="#22E6FF" stop-opacity="0.85"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22E6FF" stop-opacity="0"/><stop offset="0.5" stop-color="#22E6FF" stop-opacity="0.5"/><stop offset="1" stop-color="#22E6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22E6FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#vig)"/>
  <ellipse cx="180" cy="120" rx="420" ry="260" fill="url(#glowC)"/>
  <ellipse cx="1040" cy="270" rx="430" ry="280" fill="url(#glowV)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#22E6FF" fill-opacity="0.25"/>
  <rect x="0" y="359" width="1200" height="1" fill="#8B5CF6" fill-opacity="0.25"/>

  <g stroke="#22E6FF" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M28 60V28h32"/><path d="M1140 28h32v32"/>
  </g>
  <g stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M28 300v32h32"/><path d="M1172 332h-32v-32"/>
  </g>

  <rect x="0" y="0" width="140" height="1.6" fill="url(#scanGrad)">
    <animate attributeName="y" values="-10;360" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="-200;1200" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text x="600.0" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="6" fill="#22E6FF" fill-opacity="0.85">// FULL-STACK DEVELOPER</text>

  <g filter="url(#haze)">
    <text x="600.0" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="92" font-weight="700" letter-spacing="12" fill="url(#titleGrad)">BALDWIN</text>
  </g>

  <rect x="370.0" y="222" width="460" height="1" fill="url(#lineGrad)"/>
  <path d="M596.0 218.5l4 4-4 4-4-4z" fill="#22E6FF" fill-opacity="0.9"/>
  <text x="600.0" y="262" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8FA0AE">I build AI-powered products that actually ship — fast, clean, in production.</text>

  <g>
    <rect x="370.7" y="296" width="190.0" height="30" rx="15" fill="#4DFFC4" fill-opacity="0.07" stroke="#4DFFC4" stroke-opacity="0.45"/>
    <circle cx="388.7" cy="311" r="3" fill="#4DFFC4">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="400.7" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#8FA0AE">OPEN FOR FREELANCE</text>
  </g>
  <g>
    <rect x="574.7" y="296" width="124.4" height="30" rx="15" fill="#22E6FF" fill-opacity="0.07" stroke="#22E6FF" stroke-opacity="0.45"/>
    <circle cx="592.7" cy="311" r="3" fill="#22E6FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="604.7" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#8FA0AE">CAIRO · EG</text>
  </g>
  <g>
    <rect x="713.1" y="296" width="116.2" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <circle cx="731.1" cy="311" r="3" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="743.1" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#8FA0AE">REVO CODE</text>
  </g>
</svg>
