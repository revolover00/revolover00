name: Refresh profile stats

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate stats + contribution graph
        run: node scripts/gen-stats.mjs
        env:
          # Uses your own PAT if you add one as STATS_TOKEN (optional),
          # otherwise the built-in token — which is enough for public data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: revolover00

      - name: Commit if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats.svg assets/contrib.svg
          if git diff --staged --quiet; then
            echo "Nothing changed — stats are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh profile stats"
          git pull --rebase origin main
          # explicit HEAD:main works even on a detached checkout
          git push origin HEAD:main
